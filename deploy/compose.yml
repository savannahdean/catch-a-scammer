# Production: the database, the game, and Caddy for HTTPS. See docs/DEPLOY.md.
#
#   cd deploy
#   cp .env.example .env        # then fill it in
#   docker compose up -d --build
#
# Only Caddy is reachable from the internet (ports 80 and 443). The database
# listens on the server's own 127.0.0.1 only, for backups and SSH tunnels.
name: catch-a-scammer

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: osint
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cas -d osint"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cas:${DB_PASSWORD}@db:5432/osint
      DB_POOL_MAX: "10"
      WORLD_SEED: ${WORLD_SEED:-1337}
      STUDY_ENABLED: ${STUDY_ENABLED:-off}
      LEGACY_API: "off"
      API_DOCS: "off"
      RATE_NEW_CASE: ${RATE_NEW_CASE:-20/3600}
      RATE_MESSAGE: ${RATE_MESSAGE:-40/60}
      RATE_JOIN_STUDY: ${RATE_JOIN_STUDY:-10/3600}
      RATE_ANSWERS: ${RATE_ANSWERS:-20/3600}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
